<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人作品集</title><style>:root{--accent:#4f74ed;font-family:system-ui;background:#10131d;color:#f5f6fc}body{margin:0;padding:40px 24px}main{max-width:900px;margin:auto}nav{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding-bottom:20px}a{color:#b4bcff}h1{font-size:52px;line-height:1.2}section{padding:45px 0}.eyebrow{color:var(--accent);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}article{background:#1c2334;padding:25px;border-radius:12px}p{color:#99a4bd;line-height:1.8}button{background:var(--accent);border:0;color:white;padding:12px 20px;border-radius:8px;cursor:pointer}.mock{font-size:11px;color:#cfb373}#contact{padding:20px;background:#202840;border-radius:10px}</style></head><body><main><nav><strong>PORTFOLIO</strong><a href="#works">精选作品</a></nav><section><span class="mock">开发Mock作品集 · 非真实模型生成</span><h1>你好，<br>我让想法成为作品。</h1><p>设计、开发与创造。欢迎探索我的项目。</p><button id="contact-button">查看联系方式</button><p id="contact" hidden>联系邮箱：hello@example.com（示例）</p></section><section id="works"><span class="eyebrow">SELECTED WORKS</span><h2>精选作品</h2><div class="cards"><article><h3>任务管理</h3><p>让每天更有条理的轻量工具。</p></article><article><h3>数字花园</h3><p>记录想法并分享成长。</p></article><article><h3>创意工作台</h3><p>从一行描述到一个可用页面。</p></article></div></section></main><script>document.getElementById('contact-button').onclick=()=>{const el=document.getElementById('contact');el.hidden=!el.hidden;};</script></body></html>
