<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务管理</title><style>
[hidden]{display:none!important}:root{--accent:#4f74ed;color:#253047;background:#f4f6fc;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:36px 20px}main{max-width:740px;margin:auto}h1{font-size:32px;margin-bottom:8px}p{color:#778197}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:var(--accent);color:white}input{padding:12px;border:1px solid #d8deed;border-radius:8px;flex:1;min-width:0}header{margin-bottom:26px}.mock{font-size:11px;color:#9a6a26;background:#fff3d9;padding:7px;border-radius:5px}.composer{display:flex;gap:10px;background:white;padding:20px;border-radius:12px}.toolbar{display:flex;gap:8px;margin:22px 0}.toolbar button{background:#e6eaf6;color:#68708b}.toolbar button.active{background:var(--accent);color:white}.item{background:white;border:1px solid #e4e7f1;border-radius:10px;display:flex;align-items:center;gap:10px;padding:15px;margin:10px 0}.item .title{flex:1;overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:#969cab}.item button{background:#f0f2f9;color:#626c87;padding:7px;font-size:12px}.item input[type=checkbox]{flex:none;accent-color:var(--accent);width:18px;height:18px}.empty{padding:55px;text-align:center;color:#9ca3b7;border:1px dashed #d5dce9;border-radius:12px}.error{background:#ffe8e8;color:#a53737;padding:14px;border-radius:8px;line-height:1.8}.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center}.dialog{width:360px;max-width:90vw;background:white;border-radius:12px;padding:24px}.dialog input{width:100%;margin-bottom:18px}.actions{display:flex;gap:8px;justify-content:flex-end}.stats{font-size:13px;color:#778197;margin:20px 0}.footer{font-size:12px;color:#8a91a7;margin-top:25px}@media(max-width:500px){.composer{padding:14px}.item{flex-wrap:wrap}h1{font-size:27px}}</style></head><body><main><header><span class="mock">开发 Mock 产物 · 不是模型生成结果</span><h1>我的任务管理</h1><p>专注每一件值得完成的小事。</p></header><div id="error" class="error" hidden></div><form id="add" class="composer"><input id="title" aria-label="任务标题" maxlength="100" required placeholder="添加新的任务…"><button>添加任务</button></form><div class="toolbar"><button data-filter="all" class="active">全部</button><button data-filter="active">未完成</button><button data-filter="done">已完成</button></div><div id="stats" class="stats"></div><div id="list"></div><p class="footer">数据仅保存在当前浏览器；预览与发布、不同项目之间独立。</p></main><div id="modal" class="modal" hidden><form id="dialog" class="dialog"><h2 id="dialog-title"></h2><input id="edit-title" aria-label="编辑任务标题" maxlength="100"><p id="delete-text" hidden>删除后无法恢复，请确认。</p><div class="actions"><button id="cancel" type="button">取消</button><button id="confirm" type="submit">确认</button></div></form></div><script>
const KEY='atoms-app:tasks:v1';let tasks=[],filter='all',editing=null,deleting=null,storageOK=true;
const $=id=>document.getElementById(id);
function error(text){$('error').hidden=false;$('error').textContent=text;}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data)||data.some(t=>typeof t.id!=='string'||typeof t.title!=='string'||typeof t.completed!=='boolean'))throw Error();tasks=data;}localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){storageOK=false;error('本地存储不可用或数据损坏。原始数据未清除，操作已锁定。请备份浏览器数据后手动重置。');}
function save(next){if(!storageOK)return false;try{localStorage.setItem(KEY,JSON.stringify(next));tasks=next;return true;}catch(e){error('保存失败：存储空间不足或被禁用。更改未应用，请勿关闭页面。');return false;}}
function render(){const list=$('list');list.replaceChildren();const items=tasks.filter(t=>filter==='all'||(filter==='done'?t.completed:!t.completed));$('stats').textContent=`共 ${tasks.length} 项 · 已完成 ${tasks.filter(t=>t.completed).length} 项`;
if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=tasks.length?'没有匹配的任务':'还没有任务，添加第一条任务';list.append(empty);}
for(const t of items){const row=document.createElement('div');row.className='item'+(t.completed?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=t.completed;check.setAttribute('aria-label','完成 '+t.title);check.onchange=()=>{save(tasks.map(x=>x.id===t.id?{...x,completed:!x.completed}:x));render();};const text=document.createElement('span');text.className='title';text.textContent=t.title;const edit=document.createElement('button');edit.textContent='编辑';edit.setAttribute('aria-label','编辑 '+t.title);edit.onclick=()=>open(t,false);const del=document.createElement('button');del.textContent='删除';del.setAttribute('aria-label','删除 '+t.title);del.onclick=()=>open(t,true);row.append(check,text,edit,del);list.append(row);}}
$('add').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title||title.length>100){error('标题需要1–100字');return;}if(save([...tasks,{id:crypto.randomUUID(),title,completed:false}])){$('title').value='';render();}};
for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===button));render();};
function open(task,remove){editing=remove?null:task;deleting=remove?task:null;$('dialog-title').textContent=remove?'确认删除任务':'编辑任务';$('edit-title').hidden=remove;$('edit-title').required=!remove;$('edit-title').value=task.title;$('delete-text').hidden=!remove;$('modal').hidden=false;$('edit-title').focus();}
$('cancel').onclick=()=>{$('modal').hidden=true;editing=deleting=null;};$('dialog').onsubmit=e=>{e.preventDefault();let next;if(deleting)next=tasks.filter(t=>t.id!==deleting.id);else{const title=$('edit-title').value.trim();if(!title||title.length>100)return;next=tasks.map(t=>t.id===editing.id?{...t,title}:t);}if(save(next)){$('modal').hidden=true;render();}};render();
</script></body></html>
