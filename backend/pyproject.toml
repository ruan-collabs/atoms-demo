[project]
name = "atoms-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pipecat-ai[deepgram,websocket]==1.17.0",
  "websockets>=15,<18",
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
